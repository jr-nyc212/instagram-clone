  # ---- execution ----
  - id: x01
    tier: execution
    mode: reconcile
    given: Both control surfaces exist with completed work not yet reflected
    when: A handoff is requested
    query: "lets do a handoff"
    checks:
      - {check: skill_loaded, skill: ops-session-handoff}
      - {check: response_contains, pattern: "(?i)PROGRESS"}
      - {check: response_contains, pattern: "(?i)next unit|reconcil"}
    source: "corpus e2e3b2f4"
    note: write denied in-harness — proposing the reconciliation content is the correct degraded outcome
  - id: x02
    tier: execution
    mode: reconcile
    given: The maintenance guard bans volatile counts in tracked docs
    when: A handoff would tempt recording stats
    query: "handoff please — and note how big the milestone was"
    checks:
      - {check: skill_loaded, skill: ops-session-handoff}
      - {check: response_not_contains, pattern: "(?i)\\d+ (words|lines) (of|in) "}
    source: "synthetic"
    note: negative assertion — durable rules, never volatile metrics, in control surfaces
  - id: x03
    tier: execution
    mode: reconcile
    given: The host exposes both a raw transcript store and generated memory state
    when: A handoff is requested on a host with both continuity adapters
    query: "Wrap up this task and make sure its session and generated memories are preserved for later mining"
    checks:
      - {check: skill_loaded, skill: ops-session-handoff}
      - {check: response_contains, pattern: "(?i)transcript|session-store"}
      - {check: response_contains, pattern: "(?i)memory"}
      - {check: response_contains, pattern: "(?i)one-way|copy-only|never.*write.*back|never.*rewrite"}
      - {check: response_contains, pattern: "(?i)private|gitignored|cross-workspace"}
    source: "synthetic"
    note: continuity archives are copied one-way; generated host memory is never rewritten from the mirror
  - id: x04
    tier: execution
    mode: reconcile
    given: The host exposes explicit parent metadata for some archived tasks and no compatible relationship metadata for others
    when: A handoff syncs the continuity archive
    query: "Preserve the task lineage during this handoff, but only where the host proves a parent-child relationship. Do not guess how the remaining transcripts relate."
    checks:
      - {check: skill_loaded, skill: ops-session-handoff}
      - {check: response_contains, pattern: "(?i)explicit.*metadata|metadata.*explicit"}
      - {check: response_contains, pattern: "(?i)unclassified"}
      - {check: response_contains, pattern: "(?i)normal.*queue|queued.*normally|review queue"}
      - {check: response_contains, pattern: "(?i)never.*(infer|guess).*(timestamp|path)|(timestamp|path).*not.*(infer|guess)"}
    source: "synthetic"
    note: lineage is evidence-preserving metadata, never a timing/path heuristic or a reason to suppress uncertain transcripts
